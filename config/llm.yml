version: 1

# max_retries — 요청 **하나**를 다시 부르는 횟수다(최초 호출은 세지 않는다). 에이전트
# 밖에 있는 이유: SDK 클라이언트가 제공자마다 프로세스에 하나라 자리별로 다른 값을
# 들 곳이 없다. 적지 않으면 SDK 기본값이 Anthropic 2 · OpenAI 2 · Google 0으로 갈려,
# 같은 설정이 제공자마다 다르게 돈다 (docs/common/llm/models.md §1-1).
max_retries: 2

# operator_channel — 휘발 상태 스냅샷을 오퍼레이터 롤 메시지로 넣을지다. 에이전트마다
# 적고, 생략하면 거짓(감독 발화 뒤에 접어 넣는다 — 자리는 어느 쪽이든 발화 뒤다). Google에는 그 롤이 없어 참을 적으면
# 시작할 때 거부된다 — Anthropic(`role:"system"`)·OpenAI(`role:"developer"`)로 옮기는
# 자리에서, 그 모델이 그 롤을 받는지 확인한 뒤 켠다 (docs/common/llm/models.md §3-3).

# thinking_level — 제공자 중립 눈금(minimal·low·medium·high)이다. 어댑터 셋이 각자의
# 파라미터로 옮긴다: Anthropic은 `thinking: adaptive` + `output_config.effort`,
# Google은 `thinkingConfig.thinkingLevel`, OpenAI는 Responses의 `reasoning.effort`.
# **적지 않으면 Anthropic·OpenAI는 그 파라미터를 아예 싣지 않는다** — 사고를 모르는
# 모델도 400 없이 돈다. Google만 생략 시 minimal이다 (docs/common/llm/models.md §1-2).
#
# ⚠️ 눈금을 받는 것은 제공자가 아니라 **모델**이다 — gemini-3.7-flash는 minimal에
# 400을 낸다. 모델을 올릴 때 이 줄을 함께 본다 (docs/common/llm/models.md §1-2).

agents:
  gm:
    provider: google
    model: gemini-3.8-flash
    max_tokens: 64000
    timeout_ms: 180000
    thinking_level: low

  # 경기의 GM — 이 경기의 이력 전부를 쥐고 반응·마감 스킬을 부른다 (docs/common/llm/agents.md §3).
  # 시한은 도구 뒤의 마감 호출까지 덮는다.
  match-gm:
    provider: google
    model: gemini-3.8-flash
    max_tokens: 64000
    timeout_ms: 180000
    thinking_level: low

  # 협상 방의 GM — 이 협상의 서류·상황·방의 대화만 읽고 상대가 되어 장면과 대사를 쓴다
  # (docs/common/llm/agents.md §4-1). 도구 루프를 돌며 장면을 쓰는 머리라 매치 GM과 같은 자리다.
  negotiation-gm:
    provider: google
    model: gemini-3.8-flash
    max_tokens: 64000
    timeout_ms: 180000
    thinking_level: low

  # 끝난 경기의 평점·성장·심경 결산. 경기당 한 번, 코어 앵커와 한도 안에서 판정한다.
  finalize-match:
    provider: google
    model: gemini-3.8-flash
    max_tokens: 16000
    timeout_ms: 90000
    # 3.8-flash는 minimal에 400을 낸다 — 이 자리만 minimal로 남아 있었다 (live-schema 실측)
    thinking_level: low

  training-rater:
    provider: google
    model: gemini-3.5-flash-lite
    max_tokens: 8000
    timeout_ms: 30000
    thinking_level: minimal

  # 새 게임의 배경을 읽고 지갑·능력치의 결·시작 사건을 판정한 뒤, 그 위에서 부임 첫날의
  # 첫 장면까지 쓴다 (docs/common/llm/agents.md §4-2). **싼 자리로 보내지 않는다** — 판정만 낼
  # 때는 앵커가 답을 받쳐 줬지만 첫 장면에는 앵커가 없고, 그것이 이 게임의 첫인상이다.
  # 게임당 한 번뿐이라 이 자리의 값은 장부에 거의 서지 않는다.
  onboarding-judge:
    provider: google
    model: gemini-3.8-flash
    max_tokens: 16000
    timeout_ms: 90000
    thinking_level: low

  # 접히는 평시 대화를 한 벌 요약으로 옮긴다 (docs/common/llm/agents.md §5-1). 결산과 같은
  # 계약이라 실패는 삼키지만 읽는 양이 다르다 — 한 번에 접히는 구간 전부를 읽고 거기
  # 새로 선 인물까지 판정하므로 훈련 결산의 싼 자리로 보내지 않는다. 압축은 이력이 상한을
  # 넘을 때만이라 드물게 돈다.
  history-compactor:
    provider: google
    model: gemini-3.8-flash
    max_tokens: 8000
    timeout_ms: 60000
    thinking_level: low

# Jev interpreters run only behind GM instruction skills.
# Shared defaults; expand a role mapping to configure it independently.
# Direct TypeSafe API; TYPESAFE_API_KEY. Published input price, checked 2026-09-27.
evaluators:
  tactic-orders: &jev
    provider: typesafe
    model: jev-1.13.0
    timeout_ms: 10000
    input_usd_per_million: 0.042
  training-orders: *jev
  market-orders: *jev
  table-orders: *jev
  match-reader: *jev
